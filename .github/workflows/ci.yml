name: public-validation

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python SMOKE_TEST.py
      - run: python scripts/verify_public_results.py
      - run: python -m compileall -q antler experiments/phase5 experiments/phase6 experiments/phase7 experiments/phase8c
      - run: python paper/generate_figures.py
      - run: python paper/verify_paper.py
